<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rituel - Semaine 2 - Séance 3</title>
<style>
  :root{
    --cream:#fffdf7;
    --bleu-clair:#8fd3e8;
    --teal:#3ba5b8;
    --teal-dark:#1f7a8c;
    --navy:#1b3a4b;
    --vert:#2e8b57;
    --rouge:#c0392b;
    --badge:#e5c417;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--cream);
    color:var(--navy);
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }
  .bubble{
    position:absolute;
    border-radius:50%;
    opacity:0.12;
    background:var(--teal);
    z-index:0;
  }
  .b1{width:160px;height:160px;top:-60px;left:-60px;}
  .b2{width:120px;height:120px;top:100px;right:-50px;}
  .b3{width:100px;height:100px;bottom:80px;left:-40px;}
  .b4{width:180px;height:180px;bottom:-80px;right:-70px;}

  .container{position:relative;z-index:1;max-width:900px;margin:0 auto;}

  .header-row{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap;}
  .tag{
    padding:12px 22px;
    border-radius:0 0 14px 14px;
    color:#fff;
    font-weight:bold;
    font-size:1.1em;
    font-family:Georgia, 'Times New Roman', serif;
  }
  .tag-semaine{background:var(--bleu-clair);}
  .tag-seance{background:var(--teal);}
  .tag-rituel{background:var(--teal-dark);margin-left:auto;border-radius:14px;}

  .consigne{
    font-weight:bold;
    text-decoration:underline;
    margin:20px 0 10px;
    font-size:1.02em;
  }

  .verbe-titre{
    color:var(--teal);
    font-weight:bold;
    font-size:1.2em;
    text-align:center;
    margin:26px 0 10px;
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:10px;
    background:#fff;
  }
  th, td{
    border:1px solid var(--navy);
    padding:6px;
    text-align:center;
  }
  th{
    background:#eaf6f9;
    font-size:0.95em;
  }
  .pronom{
    font-weight:bold;
    background:#f5f5f0;
    width:160px;
    text-align:left;
    padding-left:12px;
  }

  .texte{
    background:#fff;
    border:1px solid var(--navy);
    padding:14px 18px;
    margin-bottom:10px;
    line-height:2.6;
  }
  .texte p{margin:0 0 10px;}
  .texte p:last-child{margin-bottom:0;}

  input.rep{
    width:92%;
    border:1px solid #999;
    border-radius:4px;
    padding:5px 4px;
    font-family:Arial, sans-serif;
    font-size:0.95em;
    text-align:center;
    background:#fffef9;
  }
  input.rep.trou{width:120px;}
  input.rep.correct{
    border-color:var(--vert);
    background:#e9f7ef;
    color:var(--vert);
  }
  input.rep.incorrect{
    border-color:var(--rouge);
    background:#fdecea;
    color:var(--rouge);
  }

  .actions{
    display:flex;
    gap:12px;
    justify-content:center;
    margin:26px 0 10px;
  }
  button{
    font-family:Arial, sans-serif;
    font-size:1em;
    font-weight:bold;
    padding:10px 22px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:#fff;
  }
  #btnVerifier{background:var(--teal-dark);}
  #btnVerifier:hover{background:var(--teal);}
  #btnReset{background:#999;}
  #btnReset:hover{background:#777;}

  #score{
    text-align:center;
    font-weight:bold;
    margin-top:14px;
    font-size:1.05em;
    min-height:1.4em;
  }

  .badge{
    position:absolute;
    top:6px;
    right:6px;
    width:10px;
    height:10px;
    border-radius:50%;
    border:2px solid var(--badge);
    background:#fff;
  }
</style>
</head>
<body>

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>
<div class="bubble b4"></div>

<div class="container">

  <div class="header-row">
    <div class="tag tag-semaine">Semaine 2</div>
    <div class="tag tag-seance">Séance 3</div>
    <div class="tag tag-rituel">Rituel</div>
  </div>

  <div id="rituel"></div>

  <div class="actions">
    <button id="btnVerifier">Vérifier</button>
    <button id="btnReset">Réinitialiser</button>
  </div>

  <div id="score"></div>

</div>

<script>
(function(){

  var donnees = [
    {
      "titre": "Exercice 1",
      "consigne": "Complète le tableau comme il convient :",
      "type": "tableau",
      "colonnes": ["Synonyme", "Antonyme"],
      "lignes": [
        { "libelle": "Cruel",    "reponses": [["méchant"], ["bienveillant"]] },
        { "libelle": "Paisible", "reponses": [["calme"],   ["agité"]] },
        { "libelle": "Agréable", "reponses": [["plaisant"],["désagréable"]] }
      ]
    },
    {
      "titre": "Exercice 2",
      "consigne": "Complète le texte :",
      "type": "texte",
      "paragraphes": [
        ["Ce matin, Amel ", ["a"], " décidé de rendre visite ", ["à"],
         " sa grand-mère. Elle ", ["est"], " partie tôt avec son frère. Tous les deux ", ["sont"],
         " montés dans le bus qui les conduisait ", ["vers"], " le village."],
        ["En arrivant, ils ", ["ont"], " aperçu leur grand-mère devant ", ["sa"],
         " maison. Elle ", ["leur"], " a souri ", ["et"], " les a invités ", ["à"], " entrer."]
      ]
    },
    {
      "titre": "Exercice 3",
      "consigne": "Réécris le texte en mettant les verbes au passé simple :",
      "type": "texte",
      "paragraphes": [
        ["Il ", ["entra"], " dans la maison. Il ", ["ferma"], " la porte et ", ["s'avança"],
         " vers la fenêtre. Dehors, le vent violent ", ["souffla"], " fort et les arbres ",
         ["se penchèrent"], "."]
      ]
    },
    {
      "titre": "Exercice 4",
      "consigne": "Dans le texte de l'exercice 3, repère :",
      "type": "tableau",
      "colonnes": ["Ta réponse"],
      "lignes": [
        { "libelle": "Un verbe", "reponses": [["entre","ferme","s'avance","souffle","se penchent",
                                               "entra","ferma","s'avança","souffla","se penchèrent"]] },
        { "libelle": "Un nom",               "reponses": [["maison","porte","fenêtre","vent","arbres"]] },
        { "libelle": "Un adjectif",          "reponses": [["violent"]] },
        { "libelle": "Un pronom personnel",  "reponses": [["il","se"]] },
        { "libelle": "Un déterminant",       "reponses": [["la","le","les"]] }
      ]
    }
  ];

  var attendus = [];

  function normaliser(texte){
    return String(texte)
      .trim()
      .toLowerCase()
      .replace(/[‘’ʼ`´]/g,"'")
      .replace(/\s+/g," ")
      .trim();
  }

  function retirerPronom(texte){
    return texte.replace(/^(je\s+|j'\s*|tu\s+|il\s+|elle\s+|on\s+|nous\s+|vous\s+|ils\s+|elles\s+)/,"");
  }

  function comparer(saisie, liste){
    var s = retirerPronom(normaliser(saisie));
    if (s === "") { return false; }
    for (var k = 0; k < liste.length; k++){
      if (s === retirerPronom(normaliser(liste[k]))) { return true; }
    }
    return false;
  }

  function creerChamp(liste, etroit){
    var input = document.createElement("input");
    input.type = "text";
    input.className = etroit ? "rep trou" : "rep";
    input.setAttribute("data-index", attendus.length);
    input.setAttribute("autocomplete", "off");
    attendus.push(liste);
    return input;
  }

  function construireTableau(bloc, parent){
    var table = document.createElement("table");

    var thead = document.createElement("thead");
    var trTete = document.createElement("tr");
    var thVide = document.createElement("th");
    thVide.className = "pronom";
    trTete.appendChild(thVide);
    bloc.colonnes.forEach(function(nom){
      var th = document.createElement("th");
      th.textContent = nom;
      trTete.appendChild(th);
    });
    thead.appendChild(trTete);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    bloc.lignes.forEach(function(ligne){
      var tr = document.createElement("tr");

      var tdLibelle = document.createElement("td");
      tdLibelle.className = "pronom";
      tdLibelle.textContent = ligne.libelle;
      tr.appendChild(tdLibelle);

      ligne.reponses.forEach(function(liste){
        var td = document.createElement("td");
        td.appendChild(creerChamp(liste, false));
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    parent.appendChild(table);
  }

  function construireTexte(bloc, parent){
    var cadre = document.createElement("div");
    cadre.className = "texte";

    bloc.paragraphes.forEach(function(morceaux){
      var p = document.createElement("p");
      morceaux.forEach(function(morceau){
        if (typeof morceau === "string") {
          p.appendChild(document.createTextNode(morceau));
        } else {
          p.appendChild(creerChamp(morceau, true));
        }
      });
      cadre.appendChild(p);
    });

    parent.appendChild(cadre);
  }

  function construireRituel(){
    var parent = document.getElementById("rituel");

    donnees.forEach(function(bloc){
      var titre = document.createElement("div");
      titre.className = "verbe-titre";
      titre.textContent = bloc.titre;
      parent.appendChild(titre);

      var consigne = document.createElement("p");
      consigne.className = "consigne";
      consigne.textContent = bloc.consigne;
      parent.appendChild(consigne);

      if (bloc.type === "tableau") {
        construireTableau(bloc, parent);
      } else {
        construireTexte(bloc, parent);
      }
    });
  }

  construireRituel();

  var inputs = document.querySelectorAll("input.rep");

  function verifier(){
    var total = 0;
    var correctes = 0;

    inputs.forEach(function(input){
      total++;
      var i = parseInt(input.getAttribute("data-index"), 10);
      var saisie = input.value;

      input.classList.remove("correct", "incorrect");

      if (comparer(saisie, attendus[i])) {
        input.classList.add("correct");
        correctes++;
      } else {
        input.classList.add("incorrect");
      }
    });

    var score = document.getElementById("score");
    score.textContent = "Score : " + correctes + " / " + total;
    score.style.color = (correctes === total) ? "#2e8b57" : "#1f7a8c";
  }

  function reinitialiser(){
    inputs.forEach(function(input){
      input.value = "";
      input.classList.remove("correct", "incorrect");
    });
    document.getElementById("score").textContent = "";
  }

  function verifierEnDirect(e){
    var input = e.target;
    var i = parseInt(input.getAttribute("data-index"), 10);

    if (comparer(input.value, attendus[i])) {
      input.classList.add("correct");
      input.classList.remove("incorrect");
    } else {
      input.classList.remove("correct", "incorrect");
    }
  }

  inputs.forEach(function(input){
    input.addEventListener("input", verifierEnDirect);
  });

  document.getElementById("btnVerifier").addEventListener("click", verifier);
  document.getElementById("btnReset").addEventListener("click", reinitialiser);

})();
</script>

</body>
</html>
